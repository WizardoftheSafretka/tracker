version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tracker_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tracker_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tracker_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:  # <-- ИСПРАВЛЕНО: 4 пробела
      - DEBUG=1
      - DB_NAME=tracker
      - DB_USER=postgres
      - DB_PASSWORD=G4t5a6Gta
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=m@p_u)3e56#p_0(x8=@ic1cx7$m-ad&zpky-x17t+luo%$6)6q
      - EMAIL_PASSWORD=lutmvuqzzuhdpgqa
      - TELEGRAM_TOKEN=8596404560:AAEWzrxWzHz7ssm1uArzUqnnTdQbDq3XB_4
      - ALLOWED_HOSTS=localhost,127.0.0.1,192.168.1.100,89.169.170.83
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tracker_celery
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    environment:  # <-- ИСПРАВЛЕНО: 4 пробела
      - DEBUG=1
      - DB_NAME=tracker
      - DB_USER=postgres
      - DB_PASSWORD=G4t5a6Gta
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - TELEGRAM_TOKEN=8596404560:AAEWzrxWzHz7ssm1uArzUqnnTdQbDq3XB_4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tracker_celery_beat
    command: celery -A config beat --loglevel=info
    volumes:
      - .:/app
    environment:
      - DEBUG=1
      - DB_NAME=tracker
      - DB_USER=postgres
      - DB_PASSWORD=G4t5a6Gta
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - celery

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: tracker_nginx
    ports:
      - "8080:80"
    volumes:
      - static_volume:/static
      - media_volume:/media
    depends_on:
      - backend

volumes:
  postgres_data:
  static_volume:
  media_volume: